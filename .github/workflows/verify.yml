name: Ursunalia — build and tests
on:
  push:
    branches:
      - feature/platform-foundation-v24
      - feature/royal-manuscript-rebuild
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Angular production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --watch=false
      - name: API and SQLite integration tests
        run: npm run test:server
      - name: Catalog validation
        run: node scripts/validate-catalog.mjs
