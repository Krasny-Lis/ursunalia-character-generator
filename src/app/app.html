<a class="platform-skip" href="#platform-content">Przejdź do treści</a>

<header class="platform-header">
  <div class="platform-header-inner">
    <a class="platform-brand" routerLink="/" aria-label="Ursunalia 2027 – strona główna">
      <span class="platform-brand-mark" aria-hidden="true">✦</span>
      <span class="platform-brand-copy">
        <strong>URSUNALIA</strong>
        <small>NOWE POCZĄTKI I STARE DŁUGI · 2027</small>
      </span>
    </a>

    <button type="button" class="platform-menu-toggle" [attr.aria-expanded]="menuOpen()" aria-controls="platform-navigation" [attr.aria-label]="menuOpen() ? 'Zamknij menu' : 'Otwórz menu'" (click)="menuOpen.set(!menuOpen())">{{ menuOpen() ? '✕' : '☰' }}</button>
    <nav id="platform-navigation" class="platform-nav" [class.platform-nav-open]="menuOpen()" aria-label="Nawigacja główna">
      @for (item of navigation; track item.id) {
        <a [routerLink]="item.path" routerLinkActive="platform-nav-active" (click)="closeMenu()"
          [routerLinkActiveOptions]="{ exact: true }">
          {{ item.label }}
        </a>
      }
    </nav>
  </div>
</header>

<div id="platform-content" class="platform-content" tabindex="-1">
  <router-outlet />
</div>

<footer class="platform-footer">
  <span>URSUNALIA 2027</span>
  <span>{{ event.subtitle }} · {{ event.startsAt }} – {{ event.endsAt }}</span>
  <span>Wersja robocza platformy</span>
</footer>
